tasks:
  - id: task-8105
    title: Главный экран и меню
    description: >-
      Создать продающий главный экран сайта эксперта иностранных языков: крупный
      заголовок-оффер с обещанием результата, подзаголовок, кнопка призыва к
      действию «Записаться» и липкое меню с якорной навигацией по блокам (языки,
      обо мне, методика, услуги и цены, отзывы).

      Цель: дать первый визуальный результат сразу при открытии приложения.

      Использовать продающие маркетинговые формулировки: обещание результата
      («заговорите с первого месяца»), индивидуальная программа, результат, а не
      просто часы.
    status: completed
    acceptance_criteria:
      - Главный экран отображается с цепляющим заголовком, подзаголовком и
        кнопкой «Записаться»
      - Меню с якорной навигацией работает по всем блокам сайта на десктопе
      - Меню корректно работает на мобильных
    summary:
      "Реализованы продающий главный экран (оффер «Заговорите на новом языке
      с первого месяца», подзаголовок, CTA «Записаться», блок цифр доверия) и
      липкое меню с якорной навигацией по секциям (языки, обо мне, методика,
      услуги и цены, отзывы) на десктопе и в мобильном меню-бургере. Основная
      реализация: app/page.tsx и components/site-header.tsx; секции-каркасы с id
      для якорей размещены в app/page.tsx."
